# /etc/systemd/system/logrotate.timer.d/hourly.conf  (installed by setup.sh)
# logrotate's `maxsize 64M` (logrotate.notetaker-remote) is only evaluated when
# logrotate RUNS. Debian/Ubuntu ship logrotate.timer as daily; this drop-in
# makes it hourly so an audit-log flood is cut at ~64 MB, far below the
# service's 256 MB ceiling (past which only forensic events are written).
# `daily` in the logrotate stanza still means "at most one time-based rotation
# per day", so normal rotation is unchanged.
[Timer]
OnCalendar=
OnCalendar=hourly
AccuracySec=5min
RandomizedDelaySec=2min
