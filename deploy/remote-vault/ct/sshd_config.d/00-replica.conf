# /etc/ssh/sshd_config.d/00-replica.conf — the only way in is the Mac's
# upload-only rrsync key (design 00 §4.6). Admin access is `pct enter <id>`
# from the host, not ssh.
PasswordAuthentication no
KbdInteractiveAuthentication no
PermitRootLogin no
AllowUsers replica
AllowTcpForwarding no
X11Forwarding no
AllowAgentForwarding no
PermitTunnel no
PermitUserRC no
PermitTTY no
# Named 00- because sshd uses the FIRST value it sees for each keyword.
# authorized_keys is root-owned outside the writable volume: the replica user
# can never add a key or drop the forced command.
AuthorizedKeysFile /etc/ssh/authorized_keys.replica
# The replica user has shell /bin/sh (NOT nologin): sshd runs a forced command
# via "$SHELL -c", and nologin would refuse it. The forced command is the only
# thing that user can ever run.
