name: Notetaker
options:
  bundleIdPrefix: com.rchaight
  createIntermediateGroups: true
  deploymentTarget:
    iOS: "26.0"
    macOS: "26.0"
settings:
  base:
    SWIFT_VERSION: "6.0"
    DEVELOPMENT_TEAM: 6A2NHN89Q8
    CODE_SIGN_STYLE: Automatic
    MARKETING_VERSION: "0.1.0"
    CURRENT_PROJECT_VERSION: "1"
packages:
  VaultKit: { path: Packages/VaultKit }
  MarkdownKit: { path: Packages/MarkdownKit }
  EditorKit: { path: Packages/EditorKit }
  ReadingKit: { path: Packages/ReadingKit }
  IndexKit: { path: Packages/IndexKit }
  TaskEngine: { path: Packages/TaskEngine }
  ProjectKit: { path: Packages/ProjectKit }
  ConversionKit: { path: Packages/ConversionKit }
  AIKit: { path: Packages/AIKit }
  SecurityKit: { path: Packages/SecurityKit }
  AppIntentsKit: { path: Packages/AppIntentsKit }
  MCPKit: { path: Packages/MCPKit }
targets:
  # Read-only MCP server Claude Code/Desktop spawn over stdio. macOS only —
  # iOS can't host a spawnable CLI — and bundled inside Notetaker.app so a
  # single install gives the user a server to point Claude at.
  NotetakerMCP:
    type: tool
    supportedDestinations: [macOS]
    sources:
      - MCPServer
    dependencies:
      - package: MCPKit
    settings:
      base:
        PRODUCT_NAME: notetaker-mcp
        PRODUCT_BUNDLE_IDENTIFIER: com.rchaight.notetaker.mcp
        ENABLE_HARDENED_RUNTIME: YES
        SWIFT_VERSION: "6.0"
  NotetakerWidgets:
    type: app-extension
    supportedDestinations: [iOS, macOS]
    sources:
      - Widgets
      - Shared
    info:
      path: Widgets/Info.plist
      properties:
        CFBundleDisplayName: Notetaker Widgets
        NSExtension:
          NSExtensionPointIdentifier: com.apple.widgetkit-extension
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.rchaight.notetaker.widgets
        # App-group IDs are spelled per-platform (iOS "group.", macOS
        # team-ID prefix), so the entitlements file is SDK-conditional.
        CODE_SIGN_ENTITLEMENTS: Widgets/NotetakerWidgets.entitlements
        CODE_SIGN_ENTITLEMENTS[sdk=iphoneos*]: Widgets/NotetakerWidgets-iOS.entitlements
        CODE_SIGN_ENTITLEMENTS[sdk=iphonesimulator*]: Widgets/NotetakerWidgets-iOS.entitlements
  Notetaker:
    type: application
    supportedDestinations: [iOS, macOS]
    # Declared so `xcodegen generate` emits a SHARED scheme. Left implicit
    # it only ever existed in gitignored xcuserdata, so every regenerate
    # destroyed it and broke `xcodebuild -scheme Notetaker`.
    scheme: {}
    sources:
      - App
      - Shared
    dependencies:
      - target: NotetakerWidgets
        embed: true
      # Into Contents/MacOS/, not the frameworks embed — it's an executable
      # the user (and Claude) launch by path. macOS-only so the iOS build
      # graph never sees the tool target.
      - target: NotetakerMCP
        embed: true
        codeSign: true
        destinationFilters: [macOS]
        copy:
          destination: executables
      - package: VaultKit
      - package: MarkdownKit
      - package: EditorKit
      - package: ReadingKit
      - package: IndexKit
      - package: TaskEngine
      - package: ProjectKit
      - package: ConversionKit
      - package: AIKit
      - package: SecurityKit
      - package: AppIntentsKit
    info:
      path: App/Info.plist
      properties:
        CFBundleDisplayName: Notetaker
        LSApplicationCategoryType: public.app-category.productivity
        UILaunchScreen: {}
        NSLocalNetworkUsageDescription: Notetaker connects to your own homelab servers (Ollama, docling-serve) for AI and document conversion.
        NSCalendarsFullAccessUsageDescription: Notetaker reads your calendars to list the day's meetings in daily notes. Nothing is stored or sent anywhere.
        NSUbiquitousContainers:
          iCloud.com.rchaight.notetaker:
            NSUbiquitousContainerIsDocumentScopePublic: true
            NSUbiquitousContainerSupportedFolderLevels: Any
            NSUbiquitousContainerName: Notetaker
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.rchaight.notetaker
        ASSETCATALOG_COMPILER_APPICON_NAME: AppIcon
        ENABLE_HARDENED_RUNTIME: YES
        CODE_SIGN_ENTITLEMENTS: App/Notetaker.entitlements
        CODE_SIGN_ENTITLEMENTS[sdk=iphoneos*]: App/Notetaker-iOS.entitlements
        CODE_SIGN_ENTITLEMENTS[sdk=iphonesimulator*]: App/Notetaker-iOS.entitlements
